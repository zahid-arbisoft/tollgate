# Alembic config for CLI usage during development (`uv run alembic …`).
# The running app upgrades programmatically via tollgate.store.engine.run_migrations
# and does not read this file.
[alembic]
script_location = src/tollgate/store/migrations
sqlalchemy.url = sqlite:///data/alembic-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
